# GitHub Actions workflow for MATLAB unit testing

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v1

      - name: MATLAB Hello World
        run: matlab -batch "disp('Hello, world! MATLAB is ready.')"

      - name: Run MATLAB tests
        uses: matlab-actions/run-tests@v1
        with:
          source-folder: Test
          test-results-junit: test-results/results.xml
          # Add Functions folder before tests run

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: matlab-test-results
          path: test-results/results.xml

      - name: Report test results
        uses: dorny/test-reporter@v1
        with:
          name: MATLAB Unit Tests
          path: test-results/results.xml
          reporter: java-junit

      # 👇 New step: Install xmlstarlet
      - name: Install XML tools
        run: sudo apt-get update && sudo apt-get install -y xmlstarlet

      # 👇 Parse JUnit XML and write summary with colors
      - name: Summarize test results
        run: |
          echo "### MATLAB Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Case | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY

          # Loop through testcases
          for tc in $(xmlstarlet sel -t -m "//testcase" -v "@name" -n test-results/results.xml); do
            # Check if testcase has failure or error
            fails=$(xmlstarlet sel -t -v "count(//testcase[@name='$tc']/failure)" test-results/results.xml)
            errs=$(xmlstarlet sel -t -v "count(//testcase[@name='$tc']/error)" test-results/results.xml)

            if [ "$fails" -eq 0 ] && [ "$errs" -eq 0 ]; then
              echo "| $tc | ✅ Pass |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $tc | ❌ Fail |" >> $GITHUB_STEP_SUMMARY
            fi
          done

          # Totals row
          total=$(xmlstarlet sel -t -v "count(//testcase)" test-results/results.xml)
          passed=$(xmlstarlet sel -t -v "count(//testcase[not(failure) and not(error)])" test-results/results.xml)
          failed=$((total - passed))
          echo "| **TOTAL** | $passed / $total Passed |" >> $GITHUB_STEP_SUMMARY

          

          

# GitHub Actions workflow for MATLAB unit testing

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v1

      - name: MATLAB Hello World
        run: matlab -batch "disp('Hello, world! MATLAB is ready.')"

      - name: Run MATLAB tests and write summary
        run: |
          matlab -batch "
            results = runtests('Test','IncludeSubfolders',true);

            % Build a table with test names and status
            T = table({results.Name}', [results.Passed]', [results.Failed]', [results.Incomplete]', ...
                      'VariableNames', {'TestName','Passed','Failed','Incomplete'});

            % Write Markdown table to GitHub summary
            fid = fopen(getenv('GITHUB_STEP_SUMMARY'),'a');
            fprintf(fid,'### MATLAB Test Results\n\n');
            fprintf(fid,'| TestName | Passed | Failed | Incomplete |\n');
            fprintf(fid,'|----------|--------|--------|------------|\n');
            for i=1:height(T)
                fprintf(fid,'| %s | %d | %d | %d |\n', T.TestName{i}, T.Passed(i), T.Failed(i), T.Incomplete(i));
            end
            % Totals row
            fprintf(fid,'| **TOTAL** | %d | %d | %d |\n', sum(T.Passed), sum(T.Failed), sum(T.Incomplete));
            fclose(fid);

            % Fail workflow if any test failed
            assertSuccess(results);
          "

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: matlab-test-results
          path: test-results/results.xml

      - name: Report test results
        uses: dorny/test-reporter@v1
        with:
          name: MATLAB Unit Tests
          path: test-results/results.xml
          reporter: java-junit
